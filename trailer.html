<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trailer Details | Azuchian's Triumph Trailers</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--black); }

    .t-header {
      background: var(--dark); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .t-nav {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; padding: 0 1.5rem;
    }
    .back-btn {
      display: flex; align-items: center; gap: .5rem;
      color: var(--muted); font-size: .875rem; font-weight: 600;
      text-decoration: none; transition: color .15s;
    }
    .back-btn:hover { color: var(--white); }
    .back-arrow { font-size: 1rem; }
    .t-nav-logo {
      font-size: .9rem; font-weight: 800; color: var(--white);
      text-decoration: none; display: flex; align-items: center; gap: .5rem;
    }
    .t-nav-logo span { background: var(--orange); color: var(--white); font-size: .75rem; font-weight: 900; padding: .2rem .45rem; border-radius: 4px; }
    .t-contact-btn {
      background: var(--orange); color: var(--white);
      padding: .4rem .9rem; border-radius: 5px;
      font-size: .875rem; font-weight: 600; text-decoration: none;
      transition: background .15s;
    }
    .t-contact-btn:hover { background: var(--orange2); color: var(--white); }

    /* ── LAYOUT ── */
    .trailer-page {
      max-width: 1100px; margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 3rem;
      align-items: start;
    }

    /* ── GALLERY ── */
    .gallery { position: sticky; top: 80px; }
    .gallery-main {
      width: 100%; aspect-ratio: 4/3;
      background: var(--dark); border-radius: 10px; overflow: hidden;
      margin-bottom: .75rem; position: relative;
    }
    .gallery-main img {
      width: 100%; height: 100%; object-fit: cover;
      display: block; cursor: zoom-in;
      transition: opacity .2s;
    }
    .gallery-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem; color: var(--border);
    }
    .gallery-thumbs {
      display: flex; gap: .5rem; flex-wrap: wrap;
    }
    .gallery-thumb {
      width: 70px; height: 55px; border-radius: 6px; overflow: hidden;
      border: 2px solid var(--border); cursor: pointer;
      transition: border-color .15s; flex-shrink: 0;
    }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-thumb.active { border-color: var(--orange); }
    .gallery-thumb:hover { border-color: rgba(232,119,34,.5); }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.92);
      align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 92vw; max-height: 90vh;
      object-fit: contain; border-radius: 6px;
    }
    .lightbox-close {
      position: absolute; top: 1rem; right: 1.25rem;
      color: var(--white); font-size: 2rem; cursor: pointer;
      background: none; border: none; line-height: 1;
      opacity: .7; transition: opacity .15s;
    }
    .lightbox-close:hover { opacity: 1; }
    .lightbox-prev, .lightbox-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.1); border: none; color: var(--white);
      font-size: 1.5rem; padding: .75rem .9rem; border-radius: 6px;
      cursor: pointer; transition: background .15s;
    }
    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }
    .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,.2); }

    /* ── INFO PANEL ── */
    .trailer-info { }
    .t-sku { font-size: .75rem; color: var(--orange); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .4rem; }
    .t-name { font-size: 1.6rem; font-weight: 900; color: var(--white); line-height: 1.2; margin-bottom: 1rem; letter-spacing: -.02em; }
    .t-price-row { display: flex; align-items: baseline; gap: .5rem; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .t-price { font-size: 2.2rem; font-weight: 900; color: var(--orange); }
    .t-price-note { font-size: .9rem; color: var(--muted); }

    .t-description {
      font-size: .95rem; color: var(--muted); line-height: 1.75;
      margin-bottom: 1.5rem;
    }

    .t-specs-title { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: .75rem; }
    .t-specs {
      list-style: none; padding: 0;
      display: flex; flex-direction: column; gap: .5rem;
      margin-bottom: 2rem;
    }
    .t-specs li {
      display: flex; align-items: center; gap: .65rem;
      font-size: .9rem; color: var(--text);
    }
    .t-specs li::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--orange); flex-shrink: 0;
    }

    .t-actions { display: flex; flex-direction: column; gap: .75rem; }
    .t-cta {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .9rem 1.5rem; border-radius: 8px;
      font-size: 1rem; font-weight: 700; text-decoration: none;
      cursor: pointer; border: 2px solid; transition: all .2s;
    }
    .t-cta-primary { background: var(--orange); color: var(--white); border-color: var(--orange); }
    .t-cta-primary:hover { background: transparent; color: var(--orange); }
    .t-cta-secondary { background: transparent; color: var(--text); border-color: var(--border); }
    .t-cta-secondary:hover { border-color: var(--orange); color: var(--orange); }

    .sold-ribbon {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px; padding: .85rem 1rem;
      color: #fca5a5; font-size: .9rem; font-weight: 600;
      margin-bottom: 1.5rem; text-align: center;
    }

    /* loading / error */
    .t-loading {
      max-width: 1100px; margin: 5rem auto;
      text-align: center; color: var(--muted); padding: 0 1.5rem;
    }

    @media (max-width: 820px) {
      .trailer-page { grid-template-columns: 1fr; gap: 2rem; }
      .gallery { position: static; }
    }
    @media (max-width: 480px) {
      .trailer-page { padding: 1.5rem 1rem 3rem; }
      .t-name { font-size: 1.3rem; }
      .t-price { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <header class="t-header">
    <div class="t-nav">
      <a href="index.html" class="back-btn">
        <span class="back-arrow">←</span> All Trailers
      </a>
      <a href="index.html" class="t-nav-logo">
        <span>ATT</span> Azuchian's
      </a>
      <a href="contact.html" class="t-contact-btn">Contact Us</a>
    </div>
  </header>

  <div id="page-content">
    <div class="t-loading">Loading…</div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightboxBtn()">✕</button>
    <button class="lightbox-prev" onclick="lightboxNav(-1)">‹</button>
    <img id="lightbox-img" src="" alt="" />
    <button class="lightbox-next" onclick="lightboxNav(1)">›</button>
  </div>

  <script src="inventory.js?v=1779739766"></script>
  <script>
    let images = [];
    let lbIndex = 0;

    function setMainImage(src, idx) {
      const main = document.getElementById('main-img');
      if (!main) return;
      main.style.opacity = '.5';
      setTimeout(() => { main.src = src; main.style.opacity = '1'; }, 150);
      document.querySelectorAll('.gallery-thumb').forEach((t, i) => {
        t.classList.toggle('active', i === idx);
      });
      lbIndex = idx;
    }

    function openLightbox(idx) {
      lbIndex = idx;
      document.getElementById('lightbox-img').src = images[idx];
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightboxBtn() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function closeLightbox(e) {
      if (e.target === document.getElementById('lightbox')) closeLightboxBtn();
    }

    function lightboxNav(dir) {
      lbIndex = (lbIndex + dir + images.length) % images.length;
      document.getElementById('lightbox-img').src = images[lbIndex];
      setMainImage(images[lbIndex], lbIndex);
    }

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightboxBtn();
      if (e.key === 'ArrowLeft') lightboxNav(-1);
      if (e.key === 'ArrowRight') lightboxNav(1);
    });

    function buildPage(t) {
      // meta
      document.title = `${t.name} | Azuchian's Triumph Trailers`;

      images = Array.isArray(t.images) ? t.images.filter(Boolean) : [];
      if (t.thumb && images.includes(t.thumb)) {
        images = [t.thumb, ...images.filter(s => s !== t.thumb)];
      }

      const mainImgHtml = images.length
        ? `<img id="main-img" src="${images[0]}" alt="${t.name}" onclick="openLightbox(0)" />`
        : `<div class="gallery-placeholder">🚛</div>`;

      const thumbsHtml = images.length > 1
        ? `<div class="gallery-thumbs">${images.map((src, i) =>
            `<div class="gallery-thumb ${i===0?'active':''}" onclick="setMainImage('${src}',${i})">
               <img src="${src}" alt="Photo ${i+1}" loading="lazy" />
             </div>`).join('')}</div>`
        : '';

      const specsText = Array.isArray(t.specs) ? t.specs.join('\n') : (t.specs || '');
      const descSource = specsText || t.description || '';
      const descHtml = descSource
        ? descSource.split(/\n\n+/).map(b => b.trim()).filter(Boolean)
            .map(b => `<p class="t-description">${b.replace(/\n/g, '<br>')}</p>`).join('')
        : '';
      const specsHtml = '';

      const availHtml = '';

      const ctaHtml = `
        <a href="tel:5195504584" class="t-cta t-cta-primary">
          Call to Inquire — 519-550-4584
        </a>`;

      document.getElementById('page-content').innerHTML = `
        <div class="trailer-page">
          <div class="gallery">
            <div class="gallery-main">${mainImgHtml}</div>
            ${thumbsHtml}
          </div>
          <div class="trailer-info">
            <div class="t-sku">${t.sku}</div>
            <h1 class="t-name">${t.name}</h1>
            <div class="t-price-row">
              <span class="t-price">$${Number(t.price).toLocaleString()}</span>
              <span class="t-price-note">+ HST</span>
            </div>
            ${availHtml}
            ${descHtml}
            ${specsHtml}
            <div class="t-actions">
              ${ctaHtml}
              <a href="index.html" class="t-cta t-cta-secondary">← Back to All Trailers</a>
            </div>
          </div>
        </div>`;
    }

    // Read ?sku= from URL
    const sku = new URLSearchParams(window.location.search).get('sku');

    function loadTrailer(data) {
      const trailer = data.find(t => t.sku === sku);
      if (!trailer) {
        document.getElementById('page-content').innerHTML =
          '<div class="t-loading">Trailer not found. <a href="index.html">Go back</a>.</div>';
      } else {
        buildPage(trailer);
      }
    }

    if (!sku) {
      document.getElementById('page-content').innerHTML =
        '<div class="t-loading">No trailer specified. <a href="index.html">Go back</a>.</div>';
    } else if (typeof INVENTORY !== 'undefined') {
      loadTrailer(INVENTORY);
    } else {
      fetch('inventory.json')
        .then(r => r.json())
        .then(loadTrailer)
        .catch(() => {
          document.getElementById('page-content').innerHTML =
            '<div class="t-loading">Could not load inventory. <a href="index.html">Go back</a>.</div>';
        });
    }
  </script>
</body>
</html>
