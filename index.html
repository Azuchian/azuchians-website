<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azuchian's Triumph Trailers | Sarnia, ON</title>
  <meta name="description" content="Quality trailers for sale in Sarnia, Ontario. Gooseneck, deckover, tilt, and utility trailers. Call 519-550-4584." />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── HOME GRID ── */
    html, body { overflow-x: hidden; max-width: 100%; }
    .mobile-call-bar { display: none; }
    .home-header {
      background: var(--dark);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .home-nav {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; padding: 0 1.5rem;
    }
    .home-logo {
      font-size: 1rem; font-weight: 800; color: var(--white);
      display: flex; align-items: center; gap: .6rem; text-decoration: none;
    }
    .home-logo-mark {
      background: var(--orange); color: var(--white);
      font-size: .8rem; font-weight: 900; padding: .25rem .5rem;
      border-radius: 4px; letter-spacing: .04em;
    }
    .home-nav-links { display: flex; gap: 1.75rem; align-items: center; }
    .home-nav-links a {
      color: var(--muted); font-size: .875rem; font-weight: 600;
      text-decoration: none; transition: color .15s;
    }
    .home-nav-links a:hover { color: var(--white); }
    .home-nav-links .cta {
      background: var(--orange); color: var(--white) !important;
      padding: .4rem .9rem; border-radius: 5px;
    }
    .home-nav-links .cta:hover { background: var(--orange2); }

    /* filter bar */
    .filter-bar {
      border-bottom: 1px solid var(--border);
      padding: .6rem 1.5rem;
      display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;
    }
    .fb-label { font-size: .75rem; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; margin-right: .25rem; }
    .fb-btn {
      background: none; border: 1px solid var(--border); border-radius: 99px;
      color: var(--muted); font-size: .8rem; padding: .3rem .85rem;
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .fb-btn:hover { border-color: var(--orange); color: var(--white); }
    .fb-btn.active { background: var(--orange); border-color: var(--orange); color: var(--white); }

    /* grid */
    .trailer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: var(--border);
    }
    .trailer-card {
      background: var(--black);
      display: block; text-decoration: none;
      position: relative; overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
    }
    .trailer-card img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .4s ease;
      display: block;
    }
    .trailer-card-placeholder {
      width: 100%; height: 100%;
      background: var(--dark);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; color: var(--border);
    }
    .trailer-card:hover img { transform: scale(1.04); }
    .trailer-card-info {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,.60) 50%);
      padding: 2rem 1rem .9rem;
      transform: translateY(4px);
      transition: transform .25s;
    }
    .trailer-card:hover .trailer-card-info { transform: translateY(0); }
    .tc-cat {
      font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
      color: var(--orange); margin-bottom: .2rem;
    }
    .tc-name {
      font-size: .9rem; font-weight: 700; color: var(--white);
      line-height: 1.3; margin-bottom: .3rem;
    }
    .tc-sku {
      font-size: .72rem; color: rgba(255,255,255,.4); margin-bottom: .3rem;
    }
    .tc-price {
      font-size: 1.1rem; font-weight: 900; color: var(--orange);
    }
    .tc-price-note { font-size: .75rem; color: rgba(255,255,255,.45); font-weight: 400; }

    /* empty / loading */
    .grid-message {
      grid-column: 1/-1; padding: 5rem 2rem;
      text-align: center; color: var(--muted); font-size: .95rem;
    }

    .home-footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: .75rem;
    }
    .home-footer p { font-size: .8rem; color: var(--muted); }
    .home-footer a { color: var(--muted); text-decoration: none; }
    .home-footer a:hover { color: var(--orange); }

    @media (max-width: 600px) {
      /* trailers become full-width showcase cards: image on top, details below */
      .trailer-grid {
        grid-template-columns: 1fr;
        gap: .85rem;
        background: transparent;
        padding: .85rem;
      }
      .trailer-card {
        aspect-ratio: auto;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--dark);
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
      }
      .trailer-card:hover img { transform: none; }
      .trailer-card img,
      .trailer-card-placeholder {
        position: static;
        width: 100%;
        height: auto;
        aspect-ratio: 16/10;
        object-fit: cover;
      }
      .trailer-card-info {
        position: static;
        background: none;
        transform: none;
        padding: .85rem 1rem 1rem;
      }
      .tc-cat { font-size: .66rem; margin-bottom: .25rem; }
      .tc-name { font-size: 1.02rem; color: var(--white); margin-bottom: .15rem; line-height: 1.3; }
      .tc-sku { color: var(--muted); margin-bottom: .45rem; }
      .tc-price { font-size: 1.3rem; }

      /* sticky tap-to-call bar */
      body { padding-bottom: 66px; }
      .mobile-call-bar {
        display: flex; align-items: center; justify-content: center; gap: .5rem;
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 400;
        background: var(--orange); color: var(--white);
        padding: 1rem; font-size: 1.05rem; font-weight: 800;
        text-decoration: none; box-shadow: 0 -4px 16px rgba(0,0,0,.45);
      }

      /* tighten the header so it never overflows the screen */
      .home-nav { padding: 0 1rem; height: 56px; }
      .home-logo { font-size: .82rem; gap: .4rem; line-height: 1.15; }
      .home-logo-mark { font-size: .68rem; padding: .2rem .4rem; }
      .home-nav-links { gap: .75rem; }
      .home-nav-links a { font-size: .8rem; }
      .home-nav-links .cta { padding: .35rem .7rem; white-space: nowrap; }

      /* filter row becomes one clean swipeable strip instead of wrapping */
      .filter-bar {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .filter-bar::-webkit-scrollbar { display: none; }
      .fb-label, .fb-btn { flex-shrink: 0; white-space: nowrap; }

      /* footer stacks and centers */
      .home-footer { flex-direction: column; text-align: center; gap: .5rem; }
      .home-footer p { font-size: .75rem; }
    }
    @media (max-width: 480px) {
      .home-nav-links .nav-about { display: none; }
    }
  </style>
</head>
<body style="background:var(--black)">

  <header class="home-header">
    <div class="home-nav">
      <a href="index.html" class="home-logo">
        <span class="home-logo-mark">ATT</span>
        Azuchian's Triumph Trailers
      </a>
      <div class="home-nav-links">
        <a href="about.html" class="nav-about">About</a>
        <a href="contact.html" class="cta">Contact&nbsp;Us</a>
      </div>
    </div>
    <div class="filter-bar" id="filter-bar">
      <span class="fb-label">Filter:</span>
      <button class="fb-btn active" data-cat="all">All</button>
      <button class="fb-btn" data-cat="utility">Utility</button>
      <button class="fb-btn" data-cat="dump">Dump</button>
      <button class="fb-btn" data-cat="between-fenders">Between Fenders</button>
      <button class="fb-btn" data-cat="deckover">Deckover</button>
      <button class="fb-btn" data-cat="enclosed">Enclosed</button>
    </div>
  </header>

  <main>
    <div class="trailer-grid" id="trailer-grid">
      <div class="grid-message">Loading inventory…</div>
    </div>
  </main>

  <footer class="home-footer">
    <p><a href="tel:5195504584">519-550-4584</a> &nbsp;·&nbsp; No yard, lower overhead &nbsp;·&nbsp; Serving Sarnia, Leamington &amp; SW Ontario to the US border</p>
    <p>Azuchian's Triumph Trailers &copy; 2026 &nbsp;·&nbsp; Prices + HST</p>
  </footer>

  <!-- sticky tap-to-call (mobile only) -->
  <a href="tel:5195504584" class="mobile-call-bar">📞 Call 519-550-4584</a>

  <script src="inventory.js?v=1780516224"></script>
  <script>
    const CATEGORY_ICONS = {
      'utility':'🔧','dump':'🚛','between-fenders':'🚜','deckover':'🏗️','enclosed':'🏠'
    };
    let all = [], active = 'all';

    function render() {
      const grid = document.getElementById('trailer-grid');
      const items = active === 'all' ? all : all.filter(t => t.category === active);
      if (!items.length) {
        grid.innerHTML = '<div class="grid-message">No trailers in this category.</div>';
        return;
      }
      grid.innerHTML = items.map(t => {
        const imgs = Array.isArray(t.images) ? t.images.filter(Boolean) : [];
        const thumbSrc = t.thumb || (imgs.length ? imgs[0] : '');
        const imgHtml = thumbSrc
          ? `<img src="${thumbSrc}" alt="${t.name}" loading="lazy"
                  onerror="this.outerHTML='<div class=trailer-card-placeholder>${CATEGORY_ICONS[t.category]||'🚛'}</div>'">`
          : `<div class="trailer-card-placeholder">${CATEGORY_ICONS[t.category]||'🚛'}</div>`;
        const catLabel = {
          'utility':'Utility','dump':'Dump',
          'between-fenders':'Between Fenders','deckover':'Deckover','enclosed':'Enclosed'
        }[t.category] || t.category;
        return `<a class="trailer-card" href="trailer.html?sku=${encodeURIComponent(t.sku)}">
          ${imgHtml}
          <div class="trailer-card-info">
            <div class="tc-cat">${catLabel}</div>
            <div class="tc-name">${t.name}</div>
            <div class="tc-sku">${t.sku}</div>
            <div class="tc-price">$${Number(t.price).toLocaleString()} <span class="tc-price-note">+HST</span></div>
          </div>
        </a>`;
      }).join('');
    }

    document.getElementById('filter-bar').addEventListener('click', e => {
      const btn = e.target.closest('.fb-btn');
      if (!btn) return;
      document.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      active = btn.dataset.cat;
      render();
    });

    // ── TRACKING ──
    try {
      // skip owner visits + count home at most once per visitor per day
      if (localStorage.getItem('att_owner') !== '1') {
        const today = new Date().toISOString().slice(0, 10);
        let seen = {};
        try { seen = JSON.parse(localStorage.getItem('att_viewed') || '{}'); } catch (e) {}
        if (seen['_home_'] !== today) {
          seen['_home_'] = today;
          try { localStorage.setItem('att_viewed', JSON.stringify(seen)); } catch (e) {}
          fetch('https://ljybisjhefbmjvyxjypz.supabase.co/rest/v1/rpc/track_view', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqeWJpc2poZWZibWp2eXhqeXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODI1NzQsImV4cCI6MjA5NTY1ODU3NH0.dUS4VTPVBp0hULzEiWIppfJSvF0ezXgsYCAkqfjwCqU',
              'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqeWJpc2poZWZibWp2eXhqeXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODI1NzQsImV4cCI6MjA5NTY1ODU3NH0.dUS4VTPVBp0hULzEiWIppfJSvF0ezXgsYCAkqfjwCqU'
            },
            body: JSON.stringify({ p_sku: '_home_', p_name: 'Home Page' })
          }).catch(() => {});
        }
      }
    } catch (e) {}

    if (typeof INVENTORY !== 'undefined') {
      all = INVENTORY; render();
    } else {
      fetch('inventory.json')
        .then(r => r.json())
        .then(data => { all = data; render(); })
        .catch(() => {
          document.getElementById('trailer-grid').innerHTML =
            '<div class="grid-message">Could not load inventory.</div>';
        });
    }
  </script>
</body>
</html>
